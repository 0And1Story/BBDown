name: Build Latest

on:
  pull_request:
    branches: [master]
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SDK_VERSION: "9.0.306"

jobs:
  set-date:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.get_date.outputs.date }}
      version: ${{ steps.get_date.outputs.version }}
    steps:
      - name: Get Date in UTC+8
        id: get_date
        run: |
          echo "date=$(date -u -d '8 hours' +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  build-win-x64-arm64:
    runs-on: windows-latest
    needs: set-date
    env:
      RELEASE_VERSION: ${{ needs.set-date.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Publish [win]
        run: |
          dotnet publish BBDown -r win-x64 -c Release -o artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish BBDown -r win-arm64 -c Release -o artifact-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package [win]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -LiteralPath artifact/BBDown.exe -DestinationPath "BBDown_${env:RELEASE_VERSION}_${{ needs.set-date.outputs.date }}_win-x64.zip"
          Compress-Archive -LiteralPath artifact-arm64/BBDown.exe -DestinationPath "BBDown_${env:RELEASE_VERSION}_${{ needs.set-date.outputs.date }}_win-arm64.zip"

      - name: Upload Artifact [win-x64]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: BBDown_win-x64
          path: BBDown_${{ needs.set-date.outputs.version }}_${{ needs.set-date.outputs.date }}_win-x64.zip
          if-no-files-found: error

      - name: Upload Artifact [win-arm64]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: BBDown_win-arm64
          path: BBDown_${{ needs.set-date.outputs.version }}_${{ needs.set-date.outputs.date }}_win-arm64.zip
          if-no-files-found: error

  build-linux-x64-arm64:
    runs-on: ubuntu-latest
    needs: set-date
    env:
      RELEASE_VERSION: ${{ needs.set-date.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Build x64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          # 在 Ubuntu 18.04 容器中执行完整构建流程
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            ubuntu:18.04 \
            bash -c "
              set -e

              # 安装编译和运行依赖
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y wget build-essential clang libicu-dev zlib1g libcurl4-openssl-dev libkrb5-dev

              # 下载并安装 .NET SDK
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"

              # 编译 Native AOT 输出到挂载的 artifact 目录
              dotnet publish BBDown -r linux-x64 -c Release -o /workspace/artifact
            "

      - name: Build arm64 in Ubuntu 18.04 container (for glibc 2.27 compatibility)
        run: |
          # 在 Ubuntu 18.04 容器中执行完整构建流程
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            mcr.microsoft.com/dotnet-buildtools/prereqs:ubuntu-18.04-cross-arm64-20220312201346-b2c2436 \
            bash -c "
              set -e

              # 下载并安装 .NET SDK
              DOTNET_SDK_VERSION='${{ env.DOTNET_SDK_VERSION }}'
              DOTNET_SDK_URL=\"https://builds.dotnet.microsoft.com/dotnet/Sdk/\${DOTNET_SDK_VERSION}/dotnet-sdk-\${DOTNET_SDK_VERSION}-linux-x64.tar.gz\"
              wget -nv \"\$DOTNET_SDK_URL\" -O dotnet-sdk.tar.gz
              mkdir -p /opt/dotnet
              tar -xzf dotnet-sdk.tar.gz -C /opt/dotnet
              export PATH=\"/opt/dotnet:\$PATH\"

              # 编译 Native AOT 输出到挂载的 artifact 目录
              dotnet publish BBDown -r linux-arm64 -c Release -p:StripSymbols=true -p:CppCompilerAndLinker=clang-9 -p:SysRoot=/crossrootfs/arm64 -o /workspace/artifact-arm64
            "

      - name: Package [linux]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd artifact
          zip "../BBDown_${RELEASE_VERSION}_${{ needs.set-date.outputs.date }}_linux-x64.zip" BBDown
          cd ../artifact-arm64
          zip "../BBDown_${RELEASE_VERSION}_${{ needs.set-date.outputs.date }}_linux-arm64.zip" BBDown

      - name: Upload Artifact [linux-x64]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: BBDown_linux-x64
          path: BBDown_${{ needs.set-date.outputs.version }}_${{ needs.set-date.outputs.date }}_linux-x64.zip
          if-no-files-found: error

      - name: Upload Artifact[linux-arm64]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: BBDown_linux-arm64
          path: BBDown_${{ needs.set-date.outputs.version }}_${{ needs.set-date.outputs.date }}_linux-arm64.zip
          if-no-files-found: error

  build-mac-x64-arm64:
    runs-on: macos-latest
    needs: set-date
    env:
      RELEASE_VERSION: ${{ needs.set-date.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Publish [osx]
        run: |
          dotnet publish BBDown -r osx-x64 -c Release -o artifact
          dotnet publish BBDown -r osx-arm64 -c Release -o artifact-arm64

      - name: Package [osx]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cd artifact
          zip "../BBDown_${RELEASE_VERSION}_${{ needs.set-date.outputs.date }}_osx-x64.zip" BBDown
          cd ../artifact-arm64
          zip "../BBDown_${RELEASE_VERSION}_${{ needs.set-date.outputs.date }}_osx-arm64.zip" BBDown

      - name: Upload Artifact [osx-x64]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: BBDown_osx-x64
          path: BBDown_${{ needs.set-date.outputs.version }}_${{ needs.set-date.outputs.date }}_osx-x64.zip
          if-no-files-found: error

      - name: Upload Artifact [osx-arm64]
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: BBDown_osx-arm64
          path: BBDown_${{ needs.set-date.outputs.version }}_${{ needs.set-date.outputs.date }}_osx-arm64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-win-x64-arm64, build-linux-x64-arm64, build-mac-x64-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: BBDown_*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_title="BBDown v${RELEASE_TAG#v}"
          shopt -s nullglob
          archives=(release-assets/*.zip)
          if [ "${#archives[@]}" -ne 6 ]; then
            echo "Expected six release archives, found ${#archives[@]}." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$release_title" --generate-notes --draft
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$release_title" --draft=false
